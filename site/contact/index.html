<!-- Before the page draws: the script is on; ?still asks for a picture, with nothing moving; and the first page of a visit lets
     the header come down into place (chrome.css). -->
<script>(() => {
  const root = document.documentElement;
  root.classList.add("js");
  if (new URLSearchParams(location.search).has("still")) root.classList.add("still");
  try { if (!sessionStorage.getItem("cmx-site-entered")) { sessionStorage.setItem("cmx-site-entered", "1"); root.classList.add("enter"); } }
  catch { root.classList.add("enter"); }
})()</script>

<main id="main" class="page-enter">
  <section class="contact" aria-labelledby="contact-title">
    <div class="container contact-grid">
      <h1 class="contact-title reveal" id="contact-title">联系销售</h1>
      <div class="contact-card reveal" data-contact>
        <form class="contact-form" novalidate>
          <div class="contact-field">
            <label for="c-topic">你需要哪方面的帮助？<span class="req" aria-hidden="true">*</span></label>
            <div class="contact-select">
              <select id="c-topic" name="topic" required aria-describedby="c-topic-error">
                <option value="">请选择</option>
                <option value="custom">定制开发</option>
                <option value="billing">账单与付款</option>
                <option value="other">其他</option>
              </select>
              <svg class="chev" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4.5 6.25 8 9.75l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <p class="contact-error" id="c-topic-error" hidden></p>
          </div>
          <div class="contact-more" data-more-fields hidden>
            <div class="contact-field">
              <label for="c-name">姓名<span class="req" aria-hidden="true">*</span></label>
              <input id="c-name" name="name" type="text" autocomplete="name" required aria-describedby="c-name-error">
              <p class="contact-error" id="c-name-error" hidden></p>
            </div>
            <div class="contact-field">
              <label for="c-email">邮箱<span class="req" aria-hidden="true">*</span></label>
              <p class="contact-hint" id="c-email-hint">如已注册，请填写登录邮箱。</p>
              <input id="c-email" name="email" type="email" autocomplete="email" inputmode="email" spellcheck="false" required aria-describedby="c-email-hint c-email-error">
              <p class="contact-error" id="c-email-error" hidden></p>
            </div>
            <div class="contact-field">
              <label for="c-company">公司或店铺</label>
              <input id="c-company" name="company" type="text" autocomplete="organization">
            </div>
            <div class="contact-field">
              <label for="c-message">你的需求<span class="req" aria-hidden="true">*</span></label>
              <textarea id="c-message" name="message" rows="5" required aria-describedby="c-message-error"></textarea>
              <p class="contact-error" id="c-message-error" hidden></p>
            </div>
            <div class="contact-field">
              <label class="contact-check" for="c-consent">
                <input id="c-consent" name="consent" type="checkbox" required aria-describedby="c-consent-error">
                <span>我同意 ComChatX 按照<a href="/privacy/">《隐私政策》</a>收集和使用我填写的信息</span>
              </label>
              <p class="contact-error" id="c-consent-error" hidden></p>
            </div>
          </div>
          <div class="contact-send">
            <button class="btn btn-primary contact-submit" type="submit">发邮件</button>
            <a class="contact-mail" href="mailto:support@comchatx.com" data-mail>support@comchatx.com</a>
          </div>
        </form>
        <p class="contact-status" role="status" data-status></p>
      </div>
      <aside class="contact-help reveal" aria-labelledby="help-title">
        <h2 class="contact-help-title" id="help-title">需要其他帮助？</h2>
        <a class="btn btn-outline" href="../pricing/#faq">查看常见问题</a>
      </aside>
    </div>
  </section>
